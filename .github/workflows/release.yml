name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.goos }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
          - goos: linux
            arch: arm64
          - goos: darwin
            arch: amd64
          - goos: darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: ./scripts/install.sh

      - name: Package release archive
        run: |
          tar -czf "tabby-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            bin/render-status \
            bin/render-tab \
            bin/tabby-daemon \
            bin/sidebar-renderer \
            bin/pane-header \
            bin/cycle-pane \
            bin/new-window \
            bin/manage-group

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabby-${{ matrix.goos }}-${{ matrix.arch }}
          path: tabby-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/tabby-linux-amd64/tabby-linux-amd64.tar.gz
            dist/tabby-linux-arm64/tabby-linux-arm64.tar.gz
            dist/tabby-darwin-amd64/tabby-darwin-amd64.tar.gz
            dist/tabby-darwin-arm64/tabby-darwin-arm64.tar.gz
